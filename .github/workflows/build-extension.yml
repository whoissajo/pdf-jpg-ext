name: Build browser extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package PDF to JPG extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build extension
        run: npm run build

      - name: Create unpacked-install ZIP
        run: |
          cd dist
          zip -qr ../pdf-jpg-extension.zip .
          cd ..

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-jpg-extension
          path: pdf-jpg-extension.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish the latest install ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Automatically built from commit ${GITHUB_SHA}. Download and extract pdf-jpg-extension.zip, then load the extracted folder in chrome://extensions with Developer mode enabled."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest pdf-jpg-extension.zip --clobber
            gh release edit latest --title "PDF to JPG — Latest build" --notes "$NOTES"
          else
            gh release create latest pdf-jpg-extension.zip --title "PDF to JPG — Latest build" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
